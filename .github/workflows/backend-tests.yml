name: Backend tests

on:
  push:
    branches: [main, Aarya]
  pull_request:

jobs:
  pytest-clean-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest with a clean-exit deadline
        run: python scripts/run_pytest_cleanly.py --timeout 180 -- -q
