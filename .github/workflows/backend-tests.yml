name: Backend tests

on:
  push:
    branches: [main, Aarya]
  pull_request:

jobs:
  pytest-clean-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest with a clean-exit deadline
        run: python scripts/run_pytest_cleanly.py --timeout 180 -- -q

  frontend-contract-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend contract dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Check the committed OpenAPI document
        working-directory: backend
        run: python export_openapi.py ../frontend/src/api/openapi.json --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate and verify TypeScript API types
        working-directory: frontend
        run: |
          npm run api:types
          git diff --exit-code -- src/api/generated.ts
      - name: Type-check frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
