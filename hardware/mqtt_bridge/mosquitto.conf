# Traceveil lab broker. Isolated VLAN only.
#
# TV5-05: bind to a specific lab interface, not 0.0.0.0. Change the address
# on the next line to the broker host's lab-facing address. 127.0.0.1 is the
# safe default for a single-host demo; anything reachable by nodes must be
# an explicit lab address AND covered by a host firewall rule that admits
# only the ESP32 subnet.
listener 8883 127.0.0.1

# TV5-02: mutual TLS. Point cafile/certfile/keyfile at the lab CA and the
# broker's server cert. Every ESP32 node has its own client cert whose CN
# matches its TV_SOURCE_ID; the bridge has its own client cert (CN
# tv-bridge). Anonymous access is off.
cafile   /etc/mosquitto/ca/traceveil-lab-ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile  /etc/mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true

allow_anonymous false

# TV5-03: topic ACLs pin each certificate CN to its own device topics so a
# valid node cannot publish under another node's source_id. See the
# accompanying traceveil.acl file for the pattern definitions.
acl_file /etc/mosquitto/acl/traceveil.acl

# Keep the broker chatty about auth failures so the operator sees rogue
# devices and topic-ACL violations.
log_type notice
log_type warning
log_type error
log_dest file /var/log/mosquitto/mosquitto.log

# Bound in-flight per-client so a single misbehaving node cannot flood the
# bridge.
max_inflight_messages 20
max_queued_messages   200

# Retained LWT payloads on tv/dev/{source_id}/status drive the
# heartbeat-on-disconnect behavior; leave retention enabled. Persistence
# preserves LWT across broker restart.
persistence true
persistence_location /var/lib/mosquitto/
