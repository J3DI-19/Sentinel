# Traceveil lab broker. Isolated VLAN only; no listener on the public interface.
listener 8883 0.0.0.0

# Client-certificate auth. Point cafile/certfile/keyfile at the lab CA and
# the broker's server cert; every ESP32 node has its own client cert whose
# CN matches its TV_SOURCE_ID.
cafile   /etc/mosquitto/ca/traceveil-lab-ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile  /etc/mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true

allow_anonymous false

# Keep the broker chatty about auth failures so the operator sees rogue devices.
log_type notice
log_type warning
log_type error
log_dest file /var/log/mosquitto/mosquitto.log

# Bound in-flight per-client so a single misbehaving node cannot flood the bridge.
max_inflight_messages 20
max_queued_messages   200

# Retained LWT payloads on tv/dev/{source_id}/status are required for
# heartbeat-on-disconnect behaviour; leave retention enabled.
persistence true
persistence_location /var/lib/mosquitto/
